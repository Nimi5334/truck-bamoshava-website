name: Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render site from content
        # Bakes content/site.json into index.html via truck-bamoshava's own
        # template.html (untouched — the public site's look is not part of
        # the CMS redesign). No dependencies — render.mjs uses only Node
        # built-ins.
        run: node truck-site-kit/render.mjs truck-bamoshava

      - name: Bundle CMS editor into publish directory
        # Copies the truck-site-kit editor SPA to _cms/ so it's served at
        # /<repo>/_cms/?site=… . No secrets are published — GITHUB_TOKEN in
        # config.js is unset, so the in-browser "publish to GitHub" button
        # stays a no-op; owners use "download file" instead.
        run: |
          mkdir -p truck-bamoshava/_cms truck-bamoshava/starter
          cp truck-site-kit/cms/index.html    truck-bamoshava/_cms/
          cp truck-site-kit/cms/app.js        truck-bamoshava/_cms/
          cp truck-site-kit/cms/config.js     truck-bamoshava/_cms/
          cp truck-site-kit/cms/schema.js     truck-bamoshava/_cms/
          cp truck-site-kit/cms/universal.js  truck-bamoshava/_cms/
          cp truck-site-kit/cms/zip.js        truck-bamoshava/_cms/
          # cms/app.js resolves render.mjs and starter/site.json one
          # directory above wherever it's served, so both land at the
          # publish-dir root, not inside _cms/.
          cp truck-site-kit/render.mjs truck-bamoshava/render.mjs
          # Seed the editor's first-load fallback with the REAL, current
          # content instead of the kit's generic placeholder starter, so
          # opening the editor with no local draft shows the owner's
          # actual site, not blank starter content.
          cp truck-bamoshava/content/site.json truck-bamoshava/starter/site.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./truck-bamoshava
          publish_branch: gh-pages
          force_orphan: true
