<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · Pharmacy Pickup Rail — Bright Smile Dental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#FBFBF9; --ink:#1B1F24; --label:#5C6470;
  --flag:#C22B45; --flag-soft:#FCEEF1;
  --divider:#E3E7E2; --green:#0E7A5F; --green-soft:#E8F4F0;
  --paper:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 72px}

/* ---- top bar ---- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:26px 0 18px;border-bottom:2px solid var(--divider)}
.brand{font-family:'Bitter',serif;font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand small{display:block;font-family:'Courier Prime',monospace;font-weight:400;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--label);margin-top:3px}
.newbtn{background:var(--ink);color:#fff;border:none;border-radius:4px;padding:11px 18px;font-family:'Source Sans 3';font-size:14.5px;font-weight:600;cursor:pointer}
.newbtn:hover{background:#000}

/* ---- rail ---- */
.railhead{display:flex;align-items:baseline;gap:10px;margin:30px 0 10px}
.railhead h2{font-family:'Bitter',serif;font-size:17px;font-weight:700}
.railhead .n{font-family:'Courier Prime',monospace;font-size:12px;background:var(--flag);color:#fff;border-radius:3px;padding:2px 7px;font-weight:700}
.railhead p{font-size:13.5px;color:var(--label);margin-left:auto}

.rail{border:2px solid var(--flag);border-radius:6px;background:var(--paper);overflow:hidden}
.rowA{display:grid;grid-template-columns:132px 1fr auto;align-items:center;gap:18px;min-height:64px;padding:12px 0 12px 16px;border-bottom:1px dashed #EBD3D8}
.rail .rowA:last-child{border-bottom:none}
.rowA.gone{opacity:.35}

/* status chip: shape + word + colour, never colour alone */
.chip{display:inline-flex;align-items:center;gap:7px;font-family:'Courier Prime',monospace;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:3px;white-space:nowrap}
.chip .g{width:11px;height:11px;flex:none}
.chip.review{background:var(--flag-soft);color:#8E1F32;border:1.5px solid var(--flag)}
.chip.review .g{background:var(--flag);clip-path:polygon(50% 0,100% 100%,0 100%)}          /* triangle */
.chip.live{background:var(--green-soft);color:#0A5E49;border:1.5px solid var(--green)}
.chip.live .g{background:var(--green);border-radius:50%}                                    /* circle */
.chip.draft{background:#F1F2F0;color:#4A5058;border:1.5px solid #B8BEC4}
.chip.draft .g{background:#8B929A;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}         /* diamond */

.ttl{font-family:'Bitter',serif;font-weight:600;font-size:16.5px}
.meta{font-family:'Courier Prime',monospace;font-size:12px;color:var(--label);margin-top:2px;letter-spacing:.02em}
.why{font-size:13.5px;color:#8E1F32;margin-top:3px}

/* SIGNATURE — the tear tab */
.tab{position:relative;align-self:stretch;display:flex;align-items:center;gap:9px;background:var(--flag);color:#fff;border:none;cursor:pointer;
     font-family:'Source Sans 3';font-size:14px;font-weight:600;padding:0 18px 0 22px;min-width:230px;text-align:left}
.tab:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;
     background:repeating-linear-gradient(to bottom,#fff 0 4px,transparent 4px 9px)}
.tab:hover{background:#A82339}
.tab .arrow{margin-left:auto;font-family:'Courier Prime',monospace}

/* ---- filed list ---- */
.filedhead{display:flex;align-items:baseline;gap:10px;margin:38px 0 6px}
.filedhead h2{font-family:'Bitter',serif;font-size:16px;font-weight:700;color:#3A4046}
.filedhead .n{font-family:'Courier Prime',monospace;font-size:12px;color:var(--label)}
.filed{border-top:1px solid var(--divider)}
.rowB{display:grid;grid-template-columns:132px 1fr 150px 96px;align-items:center;gap:18px;min-height:44px;padding:7px 8px 7px 16px;border-bottom:1px solid var(--divider)}
.rowB:hover{background:#F4F6F3}
.rowB .ttl{font-size:15px;font-weight:500}
.rowB .date{font-family:'Courier Prime',monospace;font-size:12px;color:var(--label);text-align:right}
.rowB .edit{justify-self:end;background:none;border:1.5px solid #C9CFC8;border-radius:4px;padding:6px 13px;font-family:'Source Sans 3';font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.rowB .edit:hover{border-color:var(--ink)}
.note{margin-top:34px;font-size:13px;color:var(--label);border-top:1px solid var(--divider);padding-top:14px;max-width:640px}
.note b{font-family:'Bitter',serif;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">Bright Smile Dental<small>Your website · pages</small></div>
    <button class="newbtn">+ New page</button>
  </header>

  <div class="railhead">
    <h2>Waiting for you</h2><span class="n" id="railN"></span>
    <p>Clear this rail and your site is up to date.</p>
  </div>
  <div class="rail" id="rail"></div>

  <div class="filedhead"><h2>Filed</h2><span class="n" id="filedN"></span></div>
  <div class="filed" id="filed"></div>

  <p class="note"><b>Signature — the tear tab.</b> Each waiting row carries a perforated tab naming the
  one action to take, in plain words. Tapping it tears the row off the rail and files it below.</p>
</div>

<script src="data.js"></script>
<script>
const chip = s => `<span class="chip ${s==='published'?'live':s}"><i class="g"></i>${STATUS_WORD[s]}</span>`;

const attention = sorted().filter(needsAttention);
const filed = sorted().filter(i => !needsAttention(i));

function action(it){
  if (it.status === 'review') return it.reason ? 'Fix: ' + it.reason.replace(/^This /,'') : 'Review this page';
  return 'Check — not touched in ' + agoWords(it.days).replace(' ago','');
}

document.getElementById('railN').textContent = attention.length;
document.getElementById('filedN').textContent = filed.length + ' pages, nothing needed';

document.getElementById('rail').innerHTML = attention.map(it => `
  <div class="rowA" data-id="${it.id}">
    <div>${chip(it.status)}</div>
    <div>
      <div class="ttl">${it.title}</div>
      <div class="meta">EDITED ${niceDate(it.edited)} · ${agoWords(it.days)}</div>
      ${it.reason ? `<div class="why">${it.reason}</div>` : ''}
    </div>
    <button class="tab">${action(it)}<span class="arrow">↓</span></button>
  </div>`).join('');

document.getElementById('filed').innerHTML = filed.map(it => `
  <div class="rowB">
    <div>${chip(it.status)}</div>
    <div class="ttl">${it.title}</div>
    <div class="date">${niceDate(it.edited)}</div>
    <button class="edit">Edit</button>
  </div>`).join('');

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', e => {
  const row = e.currentTarget.closest('.rowA');
  row.classList.add('gone');
  setTimeout(()=>{ row.style.display='none'; }, 260);
}));
</script>
</body>
</html>
